version: '3.9'

services:

  # ── SQL Server ──────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vas-sqlserver
    environment:
      SA_PASSWORD: "${SA_PASSWORD:-YourStrong!Passw0rd}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD:-YourStrong!Passw0rd}" -Q "SELECT 1" -No
      interval: 10s
      timeout: 5s
      retries: 10

  # ── .NET API ────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vas-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=VoiceAgentStudio;User Id=sa;Password=${SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET:-VoiceAgentStudio-SuperSecret-Key-2024-AtLeast32Chars!}
      - JwtSettings__Issuer=VoiceAgentStudio.API
      - JwtSettings__Audience=VoiceAgentStudio.Frontend
      - JwtSettings__ExpiryHours=8
      - DefaultAiProvider=Gemini
      - Gemini__ApiKey=${GEMINI_API_KEY}
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  # ── Angular Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vas-frontend
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlserver_data:

